baseURL = "https://kidzinski.com/"
title = "Lukas Kidzinski"
locale = "en-US"
enableRobotsTXT = true
publishDir = "public"
disableKinds = ["taxonomy", "term"]

[params]
  description = "Lukas Kidzinski. Research in machine learning, statistics, and biomechanics. Publications, projects, and press coverage."
  email = "lukasz.kidzinski@stanford.edu"
  email_secondary = "lukasz@gosset.ai"
  github = "https://github.com/kidzik"
  scholar = "https://scholar.google.com/citations?user=7rvNQJoAAAAJ"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[markup.goldmark.renderer]
  unsafe = true # Original research pages contain figures and HTML.

[markup.highlight]
  style = "friendly"

[module.hugoVersion]
  min = "0.168.0"

# Keep theme demo content on disk; publish the real research archive.
[[module.mounts]]
  source = "content/project"
  target = "content/project"
[[module.mounts]]
  source = "content/publication"
  target = "content/publication"
[[module.mounts]]
  source = "static"
  target = "static"
[[module.mounts]]
  source = "CNAME"
  target = "static/CNAME"
[[module.mounts]]
  source = "Lukasz-Kidzinski-CV.pdf"
  target = "static/Lukasz-Kidzinski-CV.pdf"
